services:
  postgres:
    image: postgres:16-alpine
    container_name: kyverance-simplified-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kyverance
      POSTGRES_PASSWORD: kyverance
      POSTGRES_DB: kyverance
    volumes:
      - kyverance_simplified_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyverance -d kyverance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kyverance-simplified-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kyverance_simplified_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kyverance_simplified_pgdata:
  kyverance_simplified_redisdata:
