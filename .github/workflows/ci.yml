# CI: backend tests + clean frontend production build
name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyverance
          POSTGRES_PASSWORD: kyverance
          POSTGRES_DB: kyverance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyverance -d kyverance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://kyverance:kyverance@localhost:5432/kyverance_test
      REDIS_URL: redis://localhost:6379/0
      DEV_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Clean production build
        run: npm run build:clean
        env:
          NEXT_PRIVATE_WORKER_THREADS: "false"
          AUTH_SECRET: ci-build-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          AUTH_MICROSOFT_ENTRA_ID_ID: ci-client-id
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ci-client-secret
          AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/common/v2.0
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
